<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us Form</title>
</head>
<body>
  <header>
    <h1>Get in Touch</h1>
    <p>Fill out the form below to send us a message.</p>
  </header>

  <main>
    <form action="/submit-form" method="POST">
      <div>
        <label for="full-name">Full Name:</label><br>
        <input type="text" id="full-name" name="full-name" placeholder="Jane Doe" required>
      </div>
      <br>

      <div>
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required>
      </div>
      <br>

      <div>
        <label for="topic">Inquiry Topic:</label><br>
        <select id="topic" name="topic">
          <option value="general">General Question</option>
          <option value="support">Technical Support</option>
          <option value="feedback">Website Feedback</option>
        </select>
      </div>
      <br>

      <div>
        <p>Preferred Contact Method:</p>
        <input type="radio" id="contact-email" name="contact-method" value="email" checked>
        <label for="contact-email">Email</label>
        <input type="radio" id="contact-phone" name="contact-method" value="phone">
        <label for="contact-phone">Phone</label>
      </div>
      <br>

      <div>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..." required></textarea>
      </div>
      <br>

      <button type="submit">Send Message</button>
      <button type="reset">Clear Form</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>
</body>
</html>
